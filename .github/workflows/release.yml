name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties | tr -d '\r')
          java=$(sed -n 's/^jdk.version=//p' buildSrc/src/main/resources/goodix-calibration/toolchain.properties | tr -d '\r')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.version.outputs.java }}

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Init secrets
        run: |
          KEYSTORE_FILE_PATH=${{ secrets.KEYSTORE_FILE_PATH }}

          touch .env
          echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE_PATH" >> .env
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> .env
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> .env
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> .env

          mkdir -p "${KEYSTORE_FILE_PATH%/*}" && touch "$KEYSTORE_FILE_PATH"
          echo "${{ secrets.KEYSTORE_FILE_CONTENT_BASE64_ENCODED }}" | base64 --decode >> $KEYSTORE_FILE_PATH

      - name: Build module and lint
        run: bash ./gradlew --no-daemon assembleModule :app:lintRelease --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Raphael Fingerprint Calibration v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/raphael-fingerprint-calibration-v${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
